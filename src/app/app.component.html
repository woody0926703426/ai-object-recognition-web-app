<div class="ai-dashboard">
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary shadow-sm">
    <div class="container">
      <span class="navbar-brand fw-bold">
        <i class="bi bi-cpu me-2 text-info"></i> NEURAL VISION CORE <small class="text-muted fs-6 ms-2">v1.0</small>
      </span>
      <span class="badge" [ngClass]="isModelLoading ? 'bg-danger' : 'bg-success'">
        {{ isModelLoading ? 'MODEL LOADING' : 'AI ENGINE READY' }}
      </span>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card bg-black border-secondary shadow-lg h-100">
          <div class="card-header bg-dark text-light border-secondary">
            <i class="bi bi-image me-2"></i> INPUT SOURCE
          </div>
          <div class="card-body d-flex flex-column align-items-center justify-content-center p-4">
            
            <div class="preview-container mb-4 w-100 text-center" *ngIf="imageUrl">
              <img [src]="imageUrl" #imageToPredict class="img-fluid rounded shadow-sm border border-secondary" style="max-height: 400px;">
            </div>

            <div class="upload-zone w-100" [class.d-none]="imageUrl">
              <label for="file-upload" class="d-flex flex-column align-items-center justify-content-center w-100 py-5 border border-2 border-dashed border-secondary rounded-4 cursor-pointer">
                <i class="bi bi-clipboard-check display-1 text-info mb-3 animate-pulse"></i>
                <p class="h5 text-light">Drag image here or <span class="text-info">Press Ctrl+V</span></p>
                <p class="small text-muted">Copy an image from any website and paste it directly!</p>
                <input id="file-upload" type="file" (change)="onFileSelected($event)" hidden accept="image/*">
              </label>
            </div>

            <button *ngIf="imageUrl" (click)="resetUpload()" class="btn btn-outline-danger mt-3">
              <i class="bi bi-arrow-counterclockwise me-2"></i> Change Image
            </button>
          </div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card bg-dark text-white border-secondary shadow h-100">
          <div class="card-header border-secondary fw-bold text-info d-flex justify-content-between">
            <span>ANALYSIS REPORT</span>
            <i class="bi bi-bar-chart-fill"></i>
          </div>
          <div class="card-body">
            <div *ngIf="predictions.length === 0" class="text-center text-muted mt-5">
              <i class="bi bi-robot display-1 mb-3 d-block opacity-25"></i>
              <p>Upload an image to start AI Inference</p>
            </div>

            <div *ngFor="let p of predictions" class="mb-4 animate-slide-in">
              <div class="d-flex justify-content-between mb-2">
                <span class="text-uppercase fw-bold tracking-wider">{{ p.className }}</span>
                <span class="text-info">{{ (p.probability * 100).toFixed(2) }}%</span>
              </div>
              <div class="progress bg-secondary" style="height: 8px;">
                <div class="progress-bar bg-info progress-bar-striped progress-bar-animated" 
                     [style.width]="(p.probability * 100) + '%'"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
